name: originator-profile/originator-profile.org/test
on: push
jobs:
  main:
    runs-on: ubuntu-latest
    # format ステップで新しいコミットを push するために write 権限を与える
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup
        uses: "./.github/actions/setup"
      - name: Format
        uses: "originator-profile/originator-profile/.github/actions/format@4b23d4456cd9e5d2744a5006ea5cf89d27110c01" # main
