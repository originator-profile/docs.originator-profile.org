name: Update opf-source subtrees
on:
  schedule:
    # 毎日 JST 9:00 (UTC 0:00) に実行
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  update-subtree:
    environment:
      name: update-opf-source
      url: https://github.com/originator-profile/docs.originator-profile.org/tree/main/opf-source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      # NOTE: 各ジョブが main に push するため直列に実行する
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: aov
            url: https://github.com/originator-profile/doc-opf-architectural-overview.git
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # NOTE: 前のジョブが push した main から始めるため、起動時のコミットではなくブランチを取り出す
          ref: main
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git config core.hooksPath .githooks
      - name: Update subtree
        run: |
          git subtree pull --prefix="opf-source/${NAME}" "${URL}" main --squash -m update
        env:
          NAME: ${{ matrix.name }}
          URL: ${{ matrix.url }}
      - name: Check for changes and push
        run: |
          if git log --oneline origin/main..@ | read; then
            git push origin main
          fi
